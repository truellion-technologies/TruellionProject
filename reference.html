<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>Truellion | Smart User Management</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: #f8fafc;
            color: #111827;
            line-height: 1.4;
        }

        .app-container {
            display: flex;
            min-height: 100vh;
            max-width: 1600px;
            margin: 0 auto;
            background: white;
            box-shadow: 0 0 30px rgba(0,0,0,0.02);
        }

        /* Sidebar */
        .sidebar {
            width: 320px;
            background: white;
            border-right: 1px solid #e9eef3;
            display: flex;
            flex-direction: column;
            padding: 28px 20px;
            flex-shrink: 0;
        }

        /* Custom Truellion Logo */
        .logo-area {
            display: flex;
            align-items: baseline;
            gap: 0px;
            margin-bottom: 40px;
            padding-bottom: 8px;
            border-bottom: 2px solid #ffedd5;
        }

        .logo-icon {
            background: #f97316;
            width: 38px;
            height: 38px;
            border-radius: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 20px;
            margin-right: 12px;
            box-shadow: 0 6px 12px -6px rgba(249,115,22,0.25);
        }

        .logo-text {
            font-size: 1.8rem;
            font-weight: 800;
            letter-spacing: -0.5px;
        }

        .logo-text .true {
            color: #111827;
        }

        .logo-text .llion {
            color: #f97316;
        }

        .notif-header {
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            font-weight: 600;
            color: #f97316;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .notif-list {
            flex: 1;
            overflow-y: auto;
            max-height: 60vh;
        }

        .notif-item {
            background: #fef9f0;
            border-left: 3px solid #f97316;
            padding: 14px 12px;
            margin-bottom: 14px;
            border-radius: 14px;
            font-size: 0.85rem;
        }

        .notif-user {
            font-weight: 700;
            color: #111827;
            margin-bottom: 5px;
        }

        .notif-action {
            color: #4b5563;
            font-size: 0.75rem;
            margin-top: 6px;
        }

        .badge-light {
            background: #fff1e6;
            padding: 2px 8px;
            border-radius: 40px;
            font-size: 0.7rem;
            color: #f97316;
            font-weight: 500;
        }

        /* Main Panel */
        .main-panel {
            flex: 1;
            padding: 28px 32px;
            background: #ffffff;
            overflow-x: auto;
        }

        /* Clickable Stats Cards - 5 cards now */
        .stats-grid {
            display: flex;
            gap: 20px;
            flex-wrap: wrap;
            margin-bottom: 32px;
        }

        .stat-card {
            background: white;
            border-radius: 28px;
            padding: 18px 20px;
            flex: 1;
            min-width: 150px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.02), 0 2px 4px rgba(0,0,0,0.02);
            border: 1px solid #f1f5f9;
            transition: all 0.2s ease;
            cursor: pointer;
        }

        .stat-card:hover {
            transform: translateY(-3px);
            box-shadow: 0 12px 24px rgba(0,0,0,0.08);
            border-color: #f97316;
        }

        .stat-card.active-filter {
            border: 2px solid #f97316;
            background: #fffaf5;
            box-shadow: 0 8px 20px rgba(249,115,22,0.15);
        }

        .stat-card h3 {
            font-size: 0.8rem;
            font-weight: 600;
            color: #f97316;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 10px;
        }

        .stat-number {
            font-size: 2.4rem;
            font-weight: 800;
            color: #111827;
            line-height: 1.2;
        }

        /* Search Bar */
        .search-section {
            margin-bottom: 24px;
        }

        .search-box {
            display: flex;
            align-items: center;
            background: #f9fafb;
            border: 1px solid #e5e7eb;
            border-radius: 60px;
            padding: 8px 20px;
            transition: all 0.2s;
        }

        .search-box:focus-within {
            border-color: #f97316;
            box-shadow: 0 0 0 3px rgba(249,115,22,0.1);
        }

        .search-box i {
            color: #9ca3af;
            font-size: 1.1rem;
        }

        .search-box input {
            border: none;
            background: transparent;
            padding: 12px 16px;
            font-size: 0.95rem;
            width: 100%;
            outline: none;
            font-family: 'Inter', sans-serif;
        }

        .clear-search {
            background: none;
            border: none;
            color: #9ca3af;
            cursor: pointer;
            font-size: 1rem;
            padding: 5px;
            display: none;
        }

        .clear-search.visible {
            display: block;
        }

        /* Users Table */
        .users-section {
            background: #ffffff;
            border-radius: 28px;
            border: 1px solid #edf2f7;
            overflow: hidden;
        }

        .section-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
            flex-wrap: wrap;
            gap: 12px;
        }

        .section-title {
            font-size: 1.3rem;
            font-weight: 600;
            color: #f97316;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .btn-add {
            background: #f97316;
            border: none;
            color: white;
            padding: 10px 24px;
            border-radius: 40px;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 8px;
            cursor: pointer;
            transition: 0.2s;
        }

        .btn-add:hover {
            background: #ea580c;
        }

        .table-wrapper {
            overflow-x: auto;
        }

        .user-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.85rem;
        }

        .user-table th {
            text-align: left;
            padding: 16px 12px;
            background: #fefaf5;
            font-weight: 600;
            color: #1e293b;
            border-bottom: 1px solid #feeedf;
        }

        .user-table td {
            padding: 14px 12px;
            border-bottom: 1px solid #f0f2f5;
            vertical-align: middle;
        }

        /* Enhanced Status Badges */
        .status-badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 5px 12px;
            border-radius: 60px;
            font-size: 0.75rem;
            font-weight: 600;
        }

        .status-badge.subscribed {
            background: #e6f7ec;
            color: #2b6e3c;
        }

        .status-badge.demo {
            background: #fff1e6;
            color: #c2410c;
        }

        .status-badge.banned {
            background: #fee2e2;
            color: #b91c1c;
        }

        .status-badge.expired {
            background: #f3f4f6;
            color: #6b7280;
        }

        .status-badge.expiring-soon {
            background: #fef3c7;
            color: #d97706;
        }

        .duration-badge {
            font-size: 0.7rem;
            background: #f1f5f9;
            padding: 4px 8px;
            border-radius: 20px;
            white-space: nowrap;
        }

        .action-buttons {
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
        }

        .btn-icon {
            border: none;
            background: transparent;
            cursor: pointer;
            font-size: 1rem;
            padding: 8px 10px;
            border-radius: 40px;
            width: 36px;
            height: 36px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            transition: 0.15s;
        }

        .btn-edit { color: #2563eb; background: #eff6ff; }
        .btn-edit:hover { background: #dbeafe; transform: scale(1.05); }
        .btn-toggle { color: #7c3aed; background: #f5f3ff; }
        .btn-toggle:hover { background: #ede9fe; transform: scale(1.05); }
        .btn-delete { color: #b91c1c; background: #fff5f5; }
        .btn-delete:hover { background: #fee2e2; transform: scale(1.05); }
        .btn-ban { color: #b45309; background: #fff7ed; }
        .btn-ban:hover { background: #ffedd5; transform: scale(1.05); }
        .btn-remove { color: #4b5563; background: #f3f4f6; }
        .btn-remove:hover { background: #e5e7eb; transform: scale(1.05); }

        /* Pagination */
        .pagination {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 8px;
            padding: 20px;
            background: white;
            border-top: 1px solid #edf2f7;
        }

        .page-btn {
            border: 1px solid #e2e8f0;
            background: white;
            padding: 8px 14px;
            border-radius: 40px;
            cursor: pointer;
            font-weight: 500;
            transition: 0.2s;
        }

        .page-btn.active {
            background: #f97316;
            color: white;
            border-color: #f97316;
        }

        .page-btn:hover:not(.active) {
            background: #fef9f0;
            border-color: #f97316;
        }

        /* Modal */
        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: rgba(0,0,0,0.4);
            align-items: center;
            justify-content: center;
            z-index: 1000;
        }
        .modal-content {
            background: white;
            max-width: 520px;
            width: 90%;
            border-radius: 32px;
            padding: 28px;
        }
        .modal-content input, .modal-content select {
            width: 100%;
            padding: 12px 14px;
            margin: 10px 0;
            border: 1px solid #e2e8f0;
            border-radius: 20px;
            font-size: 0.9rem;
        }
        .form-row {
            display: flex;
            gap: 12px;
            margin: 10px 0;
        }
        .radio-group {
            display: flex;
            gap: 20px;
            margin: 10px 0;
        }
        .modal-buttons {
            display: flex;
            justify-content: flex-end;
            gap: 12px;
            margin-top: 20px;
        }
        @media (max-width: 780px) {
            .app-container { flex-direction: column; }
            .sidebar { width: 100%; border-right: none; border-bottom: 1px solid #eee; }
            .main-panel { padding: 20px; }
        }
        .empty-row td { text-align: center; padding: 40px; color: #94a3b8; }
        .info-note { font-size: 0.7rem; color: #64748b; margin-top: 5px; }
    </style>
</head>
<body>
<div class="app-container">
    <aside class="sidebar">
        <div class="logo-area">
            <div class="logo-icon"><i class="fas fa-chart-line"></i></div>
            <div class="logo-text"><span class="true">True</span><span class="llion">llion</span></div>
        </div>
        <div class="notif-header"><i class="fas fa-bell"></i> RECENT ACTIVITY</div>
        <div class="notif-list" id="notificationList"></div>
        <div style="margin-top: 24px;">
            <div class="notif-header"><i class="fas fa-clock"></i> STATUS GUIDE</div>
            <div style="background:#fef9f0; border-radius: 20px; padding: 14px; font-size:0.7rem;">
                <i class="fas fa-circle" style="color:#2b6e3c; font-size: 0.6rem;"></i> Active Subscribed<br>
                <i class="fas fa-circle" style="color:#c2410c; font-size: 0.6rem;"></i> Active Demo<br>
                <i class="fas fa-circle" style="color:#d97706; font-size: 0.6rem;"></i> Expiring Soon (≤3 days)<br>
                <i class="fas fa-circle" style="color:#6b7280; font-size: 0.6rem;"></i> Expired<br>
                <i class="fas fa-circle" style="color:#b91c1c; font-size: 0.6rem;"></i> Banned
            </div>
        </div>
    </aside>

    <main class="main-panel">
        <!-- 5 Clickable Cards: Total, Subscribed, Demo, Banned, Expiring Soon -->
        <div class="stats-grid">
            <div class="stat-card" data-filter="all" id="filterAll"><h3><i class="fas fa-users"></i> Total Users</h3><div class="stat-number" id="totalUsersCount">0</div></div>
            <div class="stat-card" data-filter="subscribed" id="filterSubscribed"><h3><i class="fas fa-crown"></i> Subscribed</h3><div class="stat-number" id="subscribedCount">0</div></div>
            <div class="stat-card" data-filter="demo" id="filterDemo"><h3><i class="fas fa-hourglass-half"></i> Demo</h3><div class="stat-number" id="demoCount">0</div></div>
            <div class="stat-card" data-filter="banned" id="filterBanned"><h3><i class="fas fa-gavel"></i> Banned</h3><div class="stat-number" id="bannedCount">0</div></div>
            <div class="stat-card" data-filter="expiring" id="filterExpiring"><h3><i class="fas fa-exclamation-triangle"></i> Expiring Soon</h3><div class="stat-number" id="expiringCount">0</div></div>
        </div>

        <!-- Search Bar -->
        <div class="search-section">
            <div class="search-box">
                <i class="fas fa-search"></i>
                <input type="text" id="searchInput" placeholder="Search by name or email...">
                <button id="clearSearchBtn" class="clear-search"><i class="fas fa-times-circle"></i></button>
            </div>
        </div>

        <div class="section-header">
            <div class="section-title"><i class="fas fa-table-list"></i> User Directory</div>
            <button class="btn-add" id="openAddUserModalBtn"><i class="fas fa-plus-circle"></i> Add User</button>
        </div>
        <div class="users-section">
            <div class="table-wrapper">
                <table class="user-table">
                    <thead><tr><th>Name</th><th>Email</th><th>Status</th><th>Access Period</th><th>Validity</th><th>Actions</th></tr></thead>
                    <tbody id="userTableBody"></tbody>
                </table>
            </div>
            <div class="pagination" id="pagination"></div>
        </div>
    </main>
</div>

<!-- Add User Modal -->
<div id="addUserModal" class="modal"><div class="modal-content">
    <h3 style="color:#f97316;"><i class="fas fa-user-plus"></i> Create User</h3>
    <input type="text" id="userName" placeholder="Full name">
    <input type="email" id="userEmail" placeholder="Email">
    <div class="radio-group">
        <label><input type="radio" name="addAccountType" value="subscribed" checked> Subscribed</label>
        <label><input type="radio" name="addAccountType" value="demo"> Demo (7 days)</label>
    </div>
    <div class="form-row"><div class="field"><label>Start Date</label><input type="date" id="addStartDate"></div>
    <div class="field"><label>End Date</label><input type="date" id="addEndDate"></div></div>
    <div class="info-note">Demo auto-sets 7 days from today</div>
    <div class="modal-buttons"><button id="closeModalBtn">Cancel</button><button id="confirmAddUserBtn" style="background:#f97316; color:white;">Save</button></div>
</div></div>

<!-- Edit User Modal -->
<div id="editUserModal" class="modal"><div class="modal-content">
    <h3 style="color:#f97316;"><i class="fas fa-pen"></i> Edit User</h3>
    <input type="hidden" id="editUserId">
    <input type="text" id="editUserName" placeholder="Name">
    <input type="email" id="editUserEmail" placeholder="Email">
    <div class="radio-group"><label><input type="radio" name="editAccountType" value="subscribed"> Subscribed</label>
    <label><input type="radio" name="editAccountType" value="demo"> Demo</label></div>
    <div class="form-row"><div class="field"><label>Start Date</label><input type="date" id="editStartDate"></div>
    <div class="field"><label>End Date</label><input type="date" id="editEndDate"></div></div>
    <div class="modal-buttons"><button id="closeEditModalBtn">Cancel</button><button id="confirmEditUserBtn" style="background:#f97316; color:white;">Update</button></div>
</div></div>

<script>
    // User model: id, name, email, accountStatus (subscribed/demo/banned), startDate, endDate, isBanned flag
    let users = [
        { id: "1", name: "Aarav Sharma", email: "aarav@example.com", accountStatus: "subscribed", isBanned: false, startDate: "2026-01-01", endDate: "2027-01-01" },
        { id: "2", name: "Zara Khan", email: "zara@example.com", accountStatus: "demo", isBanned: false, startDate: getDefaultStart(), endDate: getDefaultEnd(7) },
        { id: "3", name: "Rohan Mehta", email: "rohan@example.com", accountStatus: "subscribed", isBanned: false, startDate: "2025-12-01", endDate: "2026-06-01" },
        { id: "4", name: "Ishita Verma", email: "ishita@example.com", accountStatus: "demo", isBanned: false, startDate: getDefaultStart(), endDate: getDefaultEnd(7) },
        { id: "5", name: "Dev Patel", email: "dev@example.com", accountStatus: "subscribed", isBanned: false, startDate: "2026-02-10", endDate: "2027-02-10" },
        { id: "6", name: "Neha Singh", email: "neha@example.com", accountStatus: "demo", isBanned: false, startDate: getDefaultStart(), endDate: getDefaultEnd(7) },
        { id: "7", name: "Arjun Reddy", email: "arjun@example.com", accountStatus: "subscribed", isBanned: true, startDate: "2026-03-01", endDate: "2027-03-01" },
        { id: "8", name: "Priya Kapoor", email: "priya@example.com", accountStatus: "demo", isBanned: false, startDate: getDefaultStart(), endDate: getDefaultEnd(7) },
    ];
    let notifications = [
        { id: "n1", user: "System", action: "Truellion ready - Banned users tracked", timestamp: Date.now() }
    ];
    let currentFilter = "all";
    let currentSearch = "";
    let currentPage = 1;
    const ITEMS_PER_PAGE = 10;

    function getDefaultStart() { return new Date().toISOString().split('T')[0]; }
    function getDefaultEnd(days) { let d = new Date(); d.setDate(d.getDate() + days); return d.toISOString().split('T')[0]; }
    function generateId() { return Date.now().toString(36) + Math.random().toString(36).substring(2); }
    function addNotification(user, action) {
        notifications.unshift({ id: generateId(), user: user, action: action, timestamp: Date.now() });
        if (notifications.length > 20) notifications.pop();
        renderNotifications();
    }

    // Determine user display status (priority: banned > expired > expiring-soon > accountStatus)
    function getUserDisplayStatus(user) {
        if (user.isBanned) return { type: "banned", label: "Banned", icon: "fas fa-ban" };
        const today = getDefaultStart();
        const endDate = user.endDate;
        if (endDate < today) return { type: "expired", label: "Expired", icon: "fas fa-calendar-times" };
        // Check if expiring within 3 days
        const threeDaysLater = new Date(); threeDaysLater.setDate(threeDaysLater.getDate() + 3);
        const threeDaysStr = threeDaysLater.toISOString().split('T')[0];
        if (endDate <= threeDaysStr && endDate >= today) return { type: "expiring-soon", label: "Expiring Soon", icon: "fas fa-hourglass-end" };
        // Normal active based on account status
        if (user.accountStatus === "subscribed") return { type: "subscribed", label: "Subscribed", icon: "fas fa-check-circle" };
        return { type: "demo", label: "Demo", icon: "fas fa-hourglass-start" };
    }

    function getFilteredUsers() {
        let filtered = [...users];
        if (currentFilter === "subscribed") filtered = filtered.filter(u => !u.isBanned && u.accountStatus === "subscribed" && u.endDate >= getDefaultStart());
        else if (currentFilter === "demo") filtered = filtered.filter(u => !u.isBanned && u.accountStatus === "demo" && u.endDate >= getDefaultStart());
        else if (currentFilter === "banned") filtered = filtered.filter(u => u.isBanned === true);
        else if (currentFilter === "expiring") {
            const today = getDefaultStart();
            const threeDaysLater = new Date(); threeDaysLater.setDate(threeDaysLater.getDate() + 3);
            const threeDaysStr = threeDaysLater.toISOString().split('T')[0];
            filtered = filtered.filter(u => !u.isBanned && u.endDate >= today && u.endDate <= threeDaysStr);
        }
        // else "all" includes everyone (banned + active + expired)
        if (currentSearch.trim()) {
            const search = currentSearch.toLowerCase();
            filtered = filtered.filter(u => u.name.toLowerCase().includes(search) || u.email.toLowerCase().includes(search));
        }
        filtered.sort((a,b) => b.id.localeCompare(a.id));
        return filtered;
    }

    function updateStatsAndCards() {
        const total = users.length;
        const subscribedActive = users.filter(u => !u.isBanned && u.accountStatus === "subscribed" && u.endDate >= getDefaultStart()).length;
        const demoActive = users.filter(u => !u.isBanned && u.accountStatus === "demo" && u.endDate >= getDefaultStart()).length;
        const banned = users.filter(u => u.isBanned === true).length;
        const today = getDefaultStart();
        const threeDaysLater = new Date(); threeDaysLater.setDate(threeDaysLater.getDate() + 3);
        const expiring = users.filter(u => !u.isBanned && u.endDate >= today && u.endDate <= threeDaysLater.toISOString().split('T')[0]).length;
        document.getElementById("totalUsersCount").innerText = total;
        document.getElementById("subscribedCount").innerText = subscribedActive;
        document.getElementById("demoCount").innerText = demoActive;
        document.getElementById("bannedCount").innerText = banned;
        document.getElementById("expiringCount").innerText = expiring;

        document.querySelectorAll('.stat-card').forEach(card => card.classList.remove('active-filter'));
        if (currentFilter === 'all') document.getElementById('filterAll').classList.add('active-filter');
        else if (currentFilter === 'subscribed') document.getElementById('filterSubscribed').classList.add('active-filter');
        else if (currentFilter === 'demo') document.getElementById('filterDemo').classList.add('active-filter');
        else if (currentFilter === 'banned') document.getElementById('filterBanned').classList.add('active-filter');
        else if (currentFilter === 'expiring') document.getElementById('filterExpiring').classList.add('active-filter');
    }

    function renderUserTable() {
        const filtered = getFilteredUsers();
        const totalPages = Math.ceil(filtered.length / ITEMS_PER_PAGE);
        if (currentPage > totalPages && totalPages > 0) currentPage = totalPages;
        if (currentPage < 1) currentPage = 1;
        const start = (currentPage - 1) * ITEMS_PER_PAGE;
        const pageUsers = filtered.slice(start, start + ITEMS_PER_PAGE);
        const tbody = document.getElementById("userTableBody");
        if (pageUsers.length === 0) { tbody.innerHTML = `<tr class="empty-row"><td colspan="6">✨ No users found ✨</td></tr>`; document.getElementById("pagination").innerHTML = ""; return; }
        
        let html = "";
        pageUsers.forEach(user => {
            const display = getUserDisplayStatus(user);
            const statusClass = display.type;
            let statusIcon = `<i class="${display.icon}"></i>`;
            const durationText = `${user.startDate} → ${user.endDate}`;
            let validityText = "";
            if (user.isBanned) validityText = "Access Revoked";
            else if (display.type === "expired") validityText = "Access Expired";
            else if (display.type === "expiring-soon") validityText = `Ends ${user.endDate} (≤3 days)`;
            else validityText = `Active until ${user.endDate}`;
            
            html += `<tr>
                        <td style="font-weight:500;">${escapeHtml(user.name)}</td>
                        <td>${escapeHtml(user.email)}</td>
                        <td><span class="status-badge ${statusClass}">${statusIcon} ${display.label}</span></td>
                        <td><span class="duration-badge"><i class="far fa-calendar-alt"></i> ${durationText}</span></td>
                        <td><span class="badge-light">${validityText}</span></td>
                        <td class="action-buttons">
                            <button class="btn-icon btn-edit" data-id="${user.id}" title="Edit"><i class="fas fa-edit"></i></button>
                            <button class="btn-icon btn-toggle" data-id="${user.id}" title="Switch Plan"><i class="fas fa-exchange-alt"></i></button>
                            <button class="btn-icon btn-delete" data-id="${user.id}" title="Delete"><i class="fas fa-trash-alt"></i></button>
                            <button class="btn-icon btn-ban" data-id="${user.id}" title="${user.isBanned ? 'Unban' : 'Ban'}"><i class="fas fa-gavel"></i></button>
                            <button class="btn-icon btn-remove" data-id="${user.id}" title="Remove"><i class="fas fa-user-minus"></i></button>
                        </td>
                     </tr>`;
        });
        tbody.innerHTML = html;
        attachTableEvents();
        renderPagination(totalPages);
    }

    function attachTableEvents() {
        document.querySelectorAll('.btn-edit').forEach(btn => btn.addEventListener('click', () => openEditModal(btn.dataset.id)));
        document.querySelectorAll('.btn-toggle').forEach(btn => btn.addEventListener('click', () => toggleAccountType(btn.dataset.id)));
        document.querySelectorAll('.btn-delete').forEach(btn => btn.addEventListener('click', () => performAction(btn.dataset.id, 'delete')));
        document.querySelectorAll('.btn-ban').forEach(btn => btn.addEventListener('click', () => toggleBan(btn.dataset.id)));
        document.querySelectorAll('.btn-remove').forEach(btn => btn.addEventListener('click', () => performAction(btn.dataset.id, 'remove')));
    }

    function toggleBan(id) {
        const user = users.find(u => u.id === id);
        if (!user) return;
        user.isBanned = !user.isBanned;
        addNotification(user.name, user.isBanned ? `Banned user` : `Unbanned user`);
        updateStatsAndCards();
        renderUserTable();
        renderNotifications();
    }

    function toggleAccountType(id) {
        const user = users.find(u => u.id === id);
        if (!user || user.isBanned) { alert("Cannot change plan for banned user"); return; }
        const old = user.accountStatus;
        const newStatus = old === "subscribed" ? "demo" : "subscribed";
        const today = getDefaultStart();
        if (newStatus === "demo") { user.startDate = today; user.endDate = getDefaultEnd(7); }
        else { user.startDate = today; let ny = new Date(); ny.setFullYear(ny.getFullYear()+1); user.endDate = ny.toISOString().split('T')[0]; }
        user.accountStatus = newStatus;
        addNotification(user.name, `Plan changed: ${old} → ${newStatus}`);
        updateStatsAndCards();
        renderUserTable();
        renderNotifications();
    }

    function performAction(id, action) {
        const idx = users.findIndex(u => u.id === id);
        if (idx === -1) return;
        const user = users[idx];
        let msg = action === 'delete' ? `Deleted ${user.name}` : `Removed ${user.name}`;
        users.splice(idx, 1);
        addNotification(user.name, msg);
        if (getFilteredUsers().length === 0 && currentPage > 1) currentPage--;
        updateStatsAndCards();
        renderUserTable();
        renderNotifications();
    }

    function addNewUser(name, email, type, sDate, eDate) {
        if (!name.trim() || !email.trim()) { alert("Name & email required"); return false; }
        if (users.some(u => u.email.toLowerCase() === email.trim().toLowerCase())) { alert("Email exists"); return false; }
        let start = sDate, end = eDate;
        if (type === "demo") { start = getDefaultStart(); end = getDefaultEnd(7); }
        if (start > end) { alert("Invalid dates"); return false; }
        const newUser = { id: generateId(), name: name.trim(), email: email.trim(), accountStatus: type, isBanned: false, startDate: start, endDate: end };
        users.unshift(newUser);
        addNotification(newUser.name, `Added (${type}) valid ${start} → ${end}`);
        currentPage = 1;
        updateStatsAndCards();
        renderUserTable();
        renderNotifications();
        return true;
    }

    function editUserLogic(id, name, email, status, sDate, eDate) {
        const user = users.find(u => u.id === id);
        if (!user) return false;
        if (!name.trim() || !email.trim()) return false;
        if (users.some(u => u.id !== id && u.email.toLowerCase() === email.toLowerCase())) { alert("Email duplicate"); return false; }
        if (sDate > eDate) { alert("End date must be after start"); return false; }
        user.name = name.trim(); user.email = email.trim(); user.accountStatus = status; user.startDate = sDate; user.endDate = eDate;
        addNotification(user.name, "User details updated");
        updateStatsAndCards();
        renderUserTable();
        renderNotifications();
        return true;
    }

    function openEditModal(id) {
        const u = users.find(u => u.id === id);
        if (!u) return;
        document.getElementById("editUserId").value = u.id;
        document.getElementById("editUserName").value = u.name;
        document.getElementById("editUserEmail").value = u.email;
        document.getElementById("editStartDate").value = u.startDate;
        document.getElementById("editEndDate").value = u.endDate;
        document.querySelector('input[name="editAccountType"][value="subscribed"]').checked = (u.accountStatus === "subscribed");
        document.querySelector('input[name="editAccountType"][value="demo"]').checked = (u.accountStatus === "demo");
        document.getElementById("editUserModal").style.display = "flex";
    }

    function renderPagination(totalPages) {
        const container = document.getElementById("pagination");
        if (totalPages <= 1) { container.innerHTML = ""; return; }
        let btns = `<button class="page-btn" data-page="prev" ${currentPage===1?'disabled style="opacity:0.5;"':''}>‹ Prev</button>`;
        for (let i = 1; i <= totalPages; i++) {
            btns += `<button class="page-btn ${i===currentPage?'active':''}" data-page="${i}">${i}</button>`;
        }
        btns += `<button class="page-btn" data-page="next" ${currentPage===totalPages?'disabled style="opacity:0.5;"':''}>Next ›</button>`;
        container.innerHTML = btns;
        container.querySelectorAll('.page-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                if (btn.dataset.page === 'prev' && currentPage > 1) currentPage--;
                else if (btn.dataset.page === 'next' && currentPage < totalPages) currentPage++;
                else if (!isNaN(parseInt(btn.dataset.page))) currentPage = parseInt(btn.dataset.page);
                renderUserTable();
            });
        });
    }

    function renderNotifications() {
        const container = document.getElementById("notificationList");
        if (!notifications.length) { container.innerHTML = '<div class="notif-item">No activity</div>'; return; }
        let html = "";
        notifications.slice(0, 12).forEach(n => {
            html += `<div class="notif-item"><div class="notif-user"><i class="fas fa-user-circle"></i> ${escapeHtml(n.user)}</div><div>${escapeHtml(n.action)}</div><div class="notif-action"><span class="badge-light">${getTimeAgo(n.timestamp)}</span></div></div>`;
        });
        container.innerHTML = html;
    }

    function getTimeAgo(ts) { const s = Math.floor((Date.now()-ts)/1000); if(s<60) return "just now"; const m=Math.floor(s/60); if(m<60) return `${m}m ago`; const h=Math.floor(m/60); if(h<24) return `${h}h ago`; const d=Math.floor(h/24); return `${d}d ago`; }
    function escapeHtml(str) { if(!str) return ""; return str.replace(/[&<>]/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[m])); }

    // Event listeners
    document.getElementById("filterAll").onclick = () => { currentFilter = "all"; currentPage = 1; updateStatsAndCards(); renderUserTable(); };
    document.getElementById("filterSubscribed").onclick = () => { currentFilter = "subscribed"; currentPage = 1; updateStatsAndCards(); renderUserTable(); };
    document.getElementById("filterDemo").onclick = () => { currentFilter = "demo"; currentPage = 1; updateStatsAndCards(); renderUserTable(); };
    document.getElementById("filterBanned").onclick = () => { currentFilter = "banned"; currentPage = 1; updateStatsAndCards(); renderUserTable(); };
    document.getElementById("filterExpiring").onclick = () => { currentFilter = "expiring"; currentPage = 1; updateStatsAndCards(); renderUserTable(); };
    document.getElementById("searchInput").addEventListener("input", (e) => { currentSearch = e.target.value; currentPage = 1; document.getElementById("clearSearchBtn").classList.toggle("visible", currentSearch.length>0); renderUserTable(); });
    document.getElementById("clearSearchBtn").onclick = () => { document.getElementById("searchInput").value = ""; currentSearch = ""; currentPage = 1; document.getElementById("clearSearchBtn").classList.remove("visible"); renderUserTable(); };
    
    // Modal handlers
    const addModal = document.getElementById("addUserModal"), editModal = document.getElementById("editUserModal");
    document.getElementById("openAddUserModalBtn").onclick = () => { 
        document.getElementById("userName").value = ""; document.getElementById("userEmail").value = "";
        document.querySelector('input[name="addAccountType"][value="subscribed"]').checked = true;
        const today = getDefaultStart(); let ny = new Date(); ny.setFullYear(ny.getFullYear()+1);
        document.getElementById("addStartDate").value = today; document.getElementById("addEndDate").value = ny.toISOString().split('T')[0];
        addModal.style.display = "flex";
    };
    document.getElementById("closeModalBtn").onclick = () => addModal.style.display = "none";
    document.getElementById("closeEditModalBtn").onclick = () => editModal.style.display = "none";
    window.onclick = e => { if(e.target === addModal) addModal.style.display="none"; if(e.target === editModal) editModal.style.display="none"; };
    document.getElementById("confirmAddUserBtn").onclick = () => {
        let type = document.querySelector('input[name="addAccountType"]:checked').value;
        let start = document.getElementById("addStartDate").value, end = document.getElementById("addEndDate").value;
        if(type === "demo") { start = getDefaultStart(); end = getDefaultEnd(7); }
        if(addNewUser(document.getElementById("userName").value, document.getElementById("userEmail").value, type, start, end)) addModal.style.display = "none";
    };
    document.getElementById("confirmEditUserBtn").onclick = () => {
        const id = document.getElementById("editUserId").value, name = document.getElementById("editUserName").value, email = document.getElementById("editUserEmail").value;
        const status = document.querySelector('input[name="editAccountType"]:checked').value;
        const sDate = document.getElementById("editStartDate").value, eDate = document.getElementById("editEndDate").value;
        if(editUserLogic(id, name, email, status, sDate, eDate)) editModal.style.display = "none";
    };
    document.querySelectorAll('input[name="addAccountType"]').forEach(r => r.addEventListener('change', e => { if(e.target.value === "demo") { document.getElementById("addStartDate").value = getDefaultStart(); document.getElementById("addEndDate").value = getDefaultEnd(7); } }));
    
    updateStatsAndCards(); renderUserTable(); renderNotifications();
</script>
</body>
</html>
